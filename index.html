<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JEELIZ FACEFILTER: CSS3D COMEDY GLASSES DEMO</title>

    <script src="dist/jeelizFaceFilter.js"></script>

    <script src="libs/three/matrix/THREEMatrix.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0"></script>
    <link rel="stylesheet" href="/style.css" type="text/css" />

    <style type="text/css">
      #jeelizFaceFilterFollow {
        display: block;
        position: absolute;
        z-index: 1000;
        background-image: url("comedy-glasses.png");
        background-size: cover;
        height: 200px;
        width: 200px;
      }
      .mouthOpened {
      }
      .mouthClosed {
      }
      #jeeFaceFilterCanvas {
        /* YOU SHOULD KEEP the transform: translateZ(-4000px) and the transform-style: preserve-3d;
      OTHERWISE THE DIV WILL BE BEHIND THE CANVAS WITH IOS
      */
        transform: translateZ(-4000px) translate(-50%, -50%) rotateY(180deg);
        transform-style: preserve-3d;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <canvas id="wtf" class="canvas"></canvas>
      <canvas id="jeeFaceFilterCanvas" class="canvas_mask"></canvas>

      <div id="jeelizFaceFilterFollow" style="display: none"></div>
    </div>
    <video id="videoElement" hidden></video>

    <h1 id="loading">loading...</h1>

    <script src="./main.js"></script>

    <style>
      html {
        height: 100%;
      }

      body {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .canvas {
        width: 100%;
        z-index: 0;
        transform: translateZ(-4000px);
        transform-style: preserve-3d;
        opacity: 1;
      }

      .canvas_mask {
        position: absolute;
        top: 0;
        padding: 0;
        width: 100%;
        opacity: 0;
      }

      #jeelizFaceFilterFollow {
        z-index: 99;
      }
    </style>
  </body>
</html>
