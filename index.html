<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JEELIZ FACEFILTER: CSS3D COMEDY GLASSES DEMO</title>
    <script src="dist/jeelizFaceFilter.js"></script>

    <!-- INCLUDE THREE.JS -->
    <script src="libs/three/v112/three.min.js"></script>
    <!-- INCLUDE JEELIZRESIZER -->
    <script src="helpers/JeelizResizer.js"></script>
    <!-- INCLUDE JEELIZ THREE.JS HELPER -->
    <script src="helpers/JeelizThreeHelper.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0"></script>
    <style>
      html {
        height: 100%;
      }

      body {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url(background.png);
        background-size: cover;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .canvas {
        height: 100%;
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 0;
        transform: translate(-50%, -50%) translateZ(-4000px);
        transform-style: preserve-3d;
        opacity: 1;
      }

      .canvas_mask {
        position: absolute;
        top: 0;
        padding: 0;
        width: 100%;
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <canvas id="wtf" class="canvas"></canvas>
      <canvas id="jeeFaceFilterCanvas" class="canvas_mask"></canvas>

      <div id="jeelizFaceFilterFollow" style="display: none"></div>
    </div>
    <video id="videoElement" hidden></video>

    <h1 id="loading">loading...</h1>

    <script src="./main.js"></script>
  </body>
</html>
