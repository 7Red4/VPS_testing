<!DOCTYPE html>
<html style="overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Face Filter Demo </title>

    <script src="/dist/jeelizFaceFilter.js"></script>
    <script src="/libs/three/v112/three.min.js"></script>
    <script src="/libs/three/v112/GLTFLoader.js"></script>
    <script src="/helpers/JeelizResizer.js"></script>
    <script src="/helpers/JeelizThreeHelper.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0"></script>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/loader.css">
    <link rel="stylesheet" href="/css/ui_controlls.css">
    <style>
      html{
          width: 100%;
          height: 100%;
      }
      body{
          width: 100%;
          height: 100%;
          margin: 0;
      }
    </style>
  </head>

  <body id="MAIN_WRAP" style="overflow: hidden">
    <div class="container">
      <canvas id="bgRemove" class="canvas"></canvas>
      <canvas id="jeeFaceFilterCanvas" class="canvas canvas_mask"></canvas>
    </div>
    <video id="videoElement" hidden muted playsinline></video>

    <div id="starting_frame">
      <div id="loading" class="hide">
        <div class="loader">
          <svg class="circular" viewBox="25 25 50 50">
            <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10" />
          </svg>
        </div>
      </div>
      <button id="load_btn" onclick="startVideoStream()">載入模組</button>
    </div>

    <div id="ui_controlls" class="hide with_toolbar_showing">
      <div id="render_picture" class="hide"></div>
      <div id="gradient_mask"></div>
      <div id="loading_circle" class="hide">
        <div class="loader">
          <svg class="circular" viewBox="25 25 50 50">
            <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10" />
          </svg>
        </div>
      </div>
      <div id="percentage" class="hide">
        <svg class="round" viewbox="0 0 100 100" width="200" height="200">
          <circle cx="50" cy="50" r="40" />
        </svg>
      </div>
      <div id="btn_shutter">
        <img src="/icons/gif.svg" style="width: 100%" />
      </div>
      <label id="switch_gif_wrapper" for="switch_gif">
        <input type="checkbox" id="switch_gif" hidden />
        <img src="/icons/gif.svg" style="width: 100%" />
      </label>
      <div id="btn_close" class="hide"></div>
      <a id="btn_save" class="hide" target="_blank">
        <img src="/icons/save_alt.svg" style="width: 100%" />
      </a>
      <!-- keep going ui -->
    </div>

    <script src="/libs/gifjs/dist/gif.js"></script>
    <script src="/main.js"></script>
    <script src="/controll.js"></script>
  </body>
</html>
