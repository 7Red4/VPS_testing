<!DOCTYPE html>
<html style="overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JEELIZ FACEFILTER: CSS3D COMEDY GLASSES DEMO</title>
    <script src="dist/jeelizFaceFilter.js"></script>

    <!-- INCLUDE THREE.JS -->
    <script src="libs/three/v112/three.min.js"></script>
    <!-- INCLUDE JEELIZRESIZER -->
    <script src="helpers/JeelizResizer.js"></script>
    <!-- INCLUDE JEELIZ THREE.JS HELPER -->
    <script src="helpers/JeelizThreeHelper.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0"></script>
    <style>
      #starting_frame {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000000aa;
      }
      #loading {
        color: #fff;
      }
      #load_btn {
      }

      html {
        height: 100%;
      }

      body {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url(background.png);
        background-size: cover;
        background-position: center;
      }

      .canvas {
        height: 100%;
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 0;
        transform: translate(-50%, -50%) translateZ(-4000px);
        transform-style: preserve-3d;
        opacity: 1;
      }

      .canvas_mask {
        transform: translate(-50%, -50%) rotateY(180deg) translateZ(-4000px);
        z-index: 2;
      }

      #videoElement {
        position: fixed;
      }

      .hide {
        display: none !important;
      }
    </style>
    <style name="loader">
      .loader {
        position: relative;
        margin: 0px auto;
        width: 100px;
      }

      .loader:before {
        content: '';
        display: block;
        padding-top: 100%;
      }

      .circular {
        -webkit-animation: rotate 2s linear infinite;
        animation: rotate 2s linear infinite;
        height: 100%;
        -webkit-transform-origin: center center;
        -ms-transform-origin: center center;
        transform-origin: center center;
        width: 100%;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        margin: auto;
      }

      .path {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
        -webkit-animation: dash 1.5s ease-in-out infinite;
        animation: dash 1.5s ease-in-out infinite;
        stroke-linecap: round;
        stroke: white;
      }

      @-webkit-keyframes rotate {
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @keyframes rotate {
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @-webkit-keyframes dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35;
        }
        100% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124;
        }
      }

      @keyframes dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35;
        }
        100% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124;
        }
      }
    </style>
    <style name="ui_controlls">
      #ui_controlls {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #loading_circle {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #render_picture {
        width: 100%;
        height: 100%;
        background-position: center;
        background-size: contain;
        background-repeat: no-repeat;
        z-index: 2;
      }
      #btn_shutter {
        cursor: pointer;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);

        width: 60px;
        height: 60px;
        background-color: #fff;
        border-radius: 100%;
        z-index: 1;
      }
      #btn_shutter::after {
        display: block;
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% + 3px);
        height: calc(100% + 3px);
        border: 4px solid #fff;
        border-radius: 100%;
      }
      #btn_close {
        cursor: pointer;
        position: absolute;
        top: 4px;
        right: 4px;
        width: 48px;
        height: 48px;
        z-index: 3;
      }
      #btn_close::before,
      #btn_close::after {
        display: block;
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 2px;
        background-color: #fff;
      }
      #btn_close::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }
      #btn_close::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }
    </style>
  </head>

  <body style="overflow: hidden">
    <div class="container">
      <canvas id="bgRemove" class="canvas"></canvas>
      <canvas id="jeeFaceFilterCanvas" class="canvas canvas_mask"></canvas>
    </div>
    <video id="videoElement" hidden muted playsinline></video>

    <div id="starting_frame">
      <div id="loading" class="hide">
        <div class="loader">
          <svg class="circular" viewBox="25 25 50 50">
            <circle
              class="path"
              cx="50"
              cy="50"
              r="20"
              fill="none"
              stroke-width="2"
              stroke-miterlimit="10"
            />
          </svg>
        </div>
      </div>
      <button id="load_btn" onclick="startVideoStream()">載入模組</button>
      <button id="start_btn" class="hide" onclick="plaVideo()">開始</button>
    </div>

    <div id="ui_controlls" class="hide">
      <div id="render_picture" class="hide"></div>
      <div id="loading_circle" class="hide">
        <div class="loader">
          <svg class="circular" viewBox="25 25 50 50">
            <circle
              class="path"
              cx="50"
              cy="50"
              r="20"
              fill="none"
              stroke-width="2"
              stroke-miterlimit="10"
            />
          </svg>
        </div>
      </div>
      <div id="btn_shutter"></div>
      <div id="btn_close" class="hide"></div>
      <!-- keep going ui -->
    </div>

    <script src="./main.js"></script>
    <script src="./controll.js"></script>
  </body>
</html>
